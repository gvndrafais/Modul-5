<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Portofolio - Text Wrapping</title>
    <style>
        .container {
            background-color: red;
            margin: auto;
            width: 500px;
            padding: 5px;
        }
        .gambar {
            height: 150px;
            width: 150px;
            float: left; /* Coba ganti menjadi right */
            margin: 5px;
        }
        .clear { clear: left; }
    </style>
</head>
<body>
    <div class="container">
        <img class="gambar" src="http://pics.unipma.ac.id/content/fasilitas/MAKNALAMBANG_02_06_2020_07_22_02logo.png" alt="Logo">
        <p class="tulisan">Lorem ipsum dolor sit amet, consectetur adipiscing elit, sed do eiusmod tempor incididunt ut labore et dolore magna aliqua. Ut enim ad minim veniam, quis nostrud exercitation ullamco laboris nisi ut aliquip ex ea commodo consequat.</p>
    </div>
    <div class="clear"></div>
</body>
</html>
