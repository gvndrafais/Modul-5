<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Position</title>
    <style>
        .container {
            margin: auto;
            width: 800px;
            height: 2000px;
        }
        .sidebar, .main, .rightbar {
            width: 100px;
            height: 100px;
        }
        .sidebar { background-color: lightgreen; }
        .main {
            background-color: lightgrey;
            position: fixed; /* Coba static, relative, absolute, dan fixed */
            top: 0;
            left: 0;
        }
        .rightbar { background-color: red; }
    </style>
</head>
<body>
    <div class="container">
        <div class="sidebar">1</div>
        <div class="main">2</div>
        <div class="rightbar">3</div>
    </div>
</body>
</html>
